<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#a52721">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Сканер подарков · Тропа единства</title>
  <link rel="stylesheet" href="scanner.css?v=1.0">
  <link rel="icon" type="image/png" href="img/mark-red.png">
</head>
<body>
  <header class="sc-head">
    <img src="img/mark-white.png" alt="Амурские сезоны" class="sc-logo">
    <div class="sc-who">
      <div id="resident" class="sc-resident">Сканер подарков</div>
      <div id="counter" class="sc-counter"></div>
    </div>
  </header>
  <div id="net" class="sc-net" hidden>Нет интернета — подарки НЕ выдавать</div>

  <main class="sc-main">
    <!-- Экран запуска / сообщений -->
    <section id="gate" class="sc-gate">
      <p id="gate-text" class="sc-gate-text">Загружаем…</p>
      <button type="button" id="start" class="sc-btn" hidden>Начать смену — включить камеру</button>
      <button type="button" id="gate-retry" class="sc-btn sc-btn-light" hidden>Повторить</button>
    </section>

    <!-- Камера -->
    <section id="cam" class="sc-cam" hidden>
      <div class="sc-video-wrap">
        <video id="video" playsinline muted autoplay></video>
        <div class="sc-frame" aria-hidden="true"></div>
      </div>
      <p class="sc-hint">Наведите камеру на QR-код гостя</p>
      <div id="toast" class="sc-toast" role="status" hidden></div>
    </section>
  </main>

  <footer class="sc-foot">
    <button type="button" id="manual-open" class="sc-link">Ввести код вручную</button>
    <button type="button" id="torch" class="sc-link" hidden>Фонарик</button>
  </footer>

  <!-- Ручной ввод -->
  <div id="manual" class="sc-manual" hidden>
    <form id="manual-form" class="sc-manual-box" autocomplete="off">
      <label for="code">Код с экрана гостя (8 знаков)</label>
      <input id="code" name="code" inputmode="text" autocapitalize="characters" spellcheck="false" maxlength="11" placeholder="XXXX-XXXX" required>
      <button type="submit" class="sc-btn">Проверить и погасить</button>
      <button type="button" id="manual-close" class="sc-btn sc-btn-light">Отмена</button>
    </form>
  </div>

  <!-- Результат -->
  <div id="result" class="sc-result" hidden role="alert" aria-live="assertive">
    <div id="result-icon" class="sc-result-icon"></div>
    <div id="result-title" class="sc-result-title"></div>
    <div id="result-text" class="sc-result-text"></div>
    <div class="sc-result-bar"><span id="result-progress"></span></div>
  </div>

  <script src="config.js?v=2.2"></script>
  <script src="api.js?v=2.2"></script>
  <script src="vendor/jsQR.js"></script>
  <script src="scanner.js?v=1.0"></script>
</body>
</html>
